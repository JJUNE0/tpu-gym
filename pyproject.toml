[project]
name = "tpu-gym"
version = "0.1.0"
description = "JAX reinforcement learning experiments on CPU, GPU and Google TPU"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "brax==0.14.2",
    "flax==0.12.6",
    "jax==0.9.2",
    "mujoco==3.11.0",
    "mujoco-mjx==3.11.0",
    "optax==0.2.8",
    "playground==0.2.0",
    "safetensors==0.8.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.9.2"]
tpu = ["jax[tpu]==0.9.2"]

[project.scripts]
tpu-gym = "tpu_gym.train:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "cuda" }, { extra = "tpu" }]]

[tool.uv.sources]
playground = { path = "third_party/mujoco_playground", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
